<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="2000" height="646" viewBox="0 0 2000 646" role="img" aria-labelledby="title desc">
<title id="title">How to play Parry Trainer</title><desc id="desc">An invisible attacker winds up a heavy melee from 6.9 to 13.4 metres away. Parry as the swing lands and the attacker is stunned. Survive the timer or hit your goals, and keep moving: standing still drains health.</desc>
<defs>
<linearGradient id="sky" x2="1" y2="1"><stop stop-color="#342a40"/><stop offset="1" stop-color="#181720"/></linearGradient>
<marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="26" markerHeight="24" refX="20" refY="12" orient="auto"><path d="M0 0L24 12L0 24L5 12Z" fill="#ffc660"/></marker>
<marker id="arrowTeal" markerUnits="userSpaceOnUse" markerWidth="26" markerHeight="24" refX="20" refY="12" orient="auto"><path d="M0 0L24 12L0 24L5 12Z" fill="#8be4e2"/></marker>
<!-- A pawn, feet at the origin. Fill and outline come from where it is used. -->
<g id="body" stroke-width="5" stroke-linejoin="round"><path d="M-25 -60C-25 -78 25 -78 25 -60L18 -4C18 0 -18 0 -18 -4Z"/><circle cy="-94" r="19"/></g>
<g id="you"><ellipse rx="34" ry="6" fill="#0c0a10" fill-opacity=".45"/><use xlink:href="#body" fill="#ffc660" stroke="#2a1d10"/></g>
<g id="foe"><ellipse rx="34" ry="6" fill="#0c0a10" fill-opacity=".45"/><use xlink:href="#body" fill="#5fc4c2" stroke="#0f2629"/></g>
<path id="next" d="M-13 -30L13 0L-13 30" fill="none" stroke="#fff0d8" stroke-opacity=".45" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
<radialGradient id="flash" cx="0" cy="0" r="120" gradientUnits="userSpaceOnUse"><stop offset=".25" stop-color="#ffc660" stop-opacity=".55"/><stop offset="1" stop-color="#ffc660" stop-opacity="0"/></radialGradient>
<linearGradient id="floor" x2="0" y2="1"><stop stop-color="#2d2535"/><stop offset="1" stop-color="#17151d"/></linearGradient>
<!-- The invisible attacker: a dashed outline. -->
<g id="ghost" fill="#8be4e2" fill-opacity=".08" stroke="#8be4e2" stroke-width="5" stroke-dasharray="9 8" stroke-linecap="round"><path d="M-25 -60C-25 -78 25 -78 25 -60L18 -4C18 0 -18 0 -18 -4Z"/><circle cy="-94" r="19"/></g>
<path id="star" d="M0 -14L4 -4.5L14 -4L6.5 3L9 13L0 7.5L-9 13L-6.5 3L-14 -4L-4 -4.5Z"/>
</defs>
<rect width="2000" height="646" fill="url(#sky)"/>
<g font-family="DejaVu Sans,sans-serif">
<rect y="410" width="1370" height="236" fill="url(#floor)"/><path d="M0 410H1370" stroke="#4a3d50" stroke-width="3"/><path d="M30 410A220 62 0 1 0 470 410A220 62 0 1 0 30 410Z M150 410A100 28 0 1 0 350 410A100 28 0 1 0 150 410Z" fill="#ffc660" fill-opacity=".13" fill-rule="evenodd"/><g fill="none" stroke="#ffc660" stroke-opacity=".75" stroke-width="4"><ellipse cx="250" cy="410" rx="100" ry="28"/><ellipse cx="250" cy="410" rx="220" ry="62" stroke-dasharray="14 10"/></g><g transform="translate(250 410) scale(1.1)"><use xlink:href="#you"/></g><g transform="translate(410 432) scale(1.1)"><use xlink:href="#ghost"/></g><circle cx="462" cy="278" r="17" fill="none" stroke="#8be4e2" stroke-width="5" stroke-dasharray="8 7"/><path d="M446 240C480 210 512 240 498 274" fill="none" stroke="#8be4e2" stroke-width="5" stroke-linecap="round" marker-end="url(#arrowTeal)"/><g><rect x="291.8" y="118.0" width="216.3" height="64" rx="32.0" fill="#15101C" stroke="#ffffff" stroke-opacity=".14" stroke-width="2"/><text x="319.8" y="162.2" font-size="34" font-weight="bold" fill="#a9f2ed">Wind-up</text></g><g><rect x="117.8" y="508.0" width="264.4" height="64" rx="32.0" fill="#15101C" stroke="#ffffff" stroke-opacity=".14" stroke-width="2"/><text x="145.8" y="552.2" font-size="34" font-weight="bold" fill="#fff0d8">6.9–13.4 m</text></g><use xlink:href="#next" x="562" y="320"/><circle cx="770" cy="344" r="120" fill="url(#flash)"/><g transform="translate(940 410) scale(1.1)"><use xlink:href="#ghost"/></g><path d="M910 260C880 290 880 320 890 350" fill="none" stroke="#8be4e2" stroke-width="12" stroke-linecap="round" stroke-opacity=".6"/><g transform="translate(770 410) scale(1.1)"><use xlink:href="#you"/></g><circle cx="770" cy="344" r="94" fill="none" stroke="#ffc660" stroke-width="9"/><g stroke="#ffc660" stroke-width="7" stroke-linecap="round"><path d="M0 -110V-134" transform="translate(770 344) rotate(-60)"/><path d="M0 -110V-134" transform="translate(770 344) rotate(-30)"/><path d="M0 -110V-134" transform="translate(770 344) rotate(0)"/><path d="M0 -110V-134" transform="translate(770 344) rotate(30)"/><path d="M0 -110V-134" transform="translate(770 344) rotate(60)"/><path d="M0 -110V-134" transform="translate(770 344) rotate(210)"/><path d="M0 -110V-134" transform="translate(770 344) rotate(240)"/><path d="M0 -110V-134" transform="translate(770 344) rotate(270)"/><path d="M0 -110V-134" transform="translate(770 344) rotate(300)"/><path d="M0 -110V-134" transform="translate(770 344) rotate(330)"/></g><g><rect x="690.7" y="118.0" width="158.6" height="64" rx="32.0" fill="#ffc660"/><text x="718.7" y="162.2" font-size="34" font-weight="bold" fill="#2a1d10">Parry</text></g><g><rect x="854.0" y="508.0" width="172.1" height="64" rx="32.0" fill="#15101C" stroke="#ffffff" stroke-opacity=".14" stroke-width="2"/><text x="882.0" y="552.2" font-size="34" font-weight="bold" fill="#a9f2ed">Swing</text></g><use xlink:href="#next" x="1022" y="320"/><g transform="translate(1110 410) scale(1.1)"><use xlink:href="#you"/></g><g transform="translate(1240 410) rotate(8)"><g transform="scale(1.1)"><use xlink:href="#ghost" fill-opacity=".3"/></g></g><ellipse cx="1256" cy="264" rx="58" ry="15" fill="none" stroke="#8be4e2" stroke-opacity=".5" stroke-width="3"/><g fill="#ffc660" stroke="#2a1d10" stroke-width="2.5" stroke-linejoin="round"><use xlink:href="#star" x="1202" y="260"/><use xlink:href="#star" x="1264" y="279"/><use xlink:href="#star" x="1308" y="254"/></g><g><rect x="1141.6" y="118.0" width="216.7" height="64" rx="32.0" fill="#15101C" stroke="#ffffff" stroke-opacity=".14" stroke-width="2"/><text x="1169.6" y="162.2" font-size="34" font-weight="bold" fill="#a9f2ed">Stunned</text></g><path d="M1370 0V646" stroke="#4a3d50" stroke-width="2"/><text x="1440" y="104" font-size="46" font-weight="bold" fill="#fff0d8">Win the drill</text><path d="M1440 146H1930" stroke="#685767" stroke-width="2"/><circle cx="1470" cy="220" r="26" fill="none" stroke="#ffc660" stroke-width="5"/><path d="M1470 204.4V220L1481.7 228.3" fill="none" stroke="#ffc660" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="1526" y="233" font-size="36" font-weight="bold" fill="#fff0d8">Survive the timer</text><g fill="none" stroke="#ffc660" stroke-width="5"><circle cx="1470" cy="330" r="26"/><circle cx="1470" cy="330" r="13"/></g><circle cx="1470" cy="330" r="4" fill="#ffc660"/><text x="1526" y="343" font-size="36" font-weight="bold" fill="#fff0d8">Hit your goals</text><path d="M1440 400H1930" stroke="#685767" stroke-width="2"/><g transform="translate(1470 500) scale(0.62)"><use xlink:href="#you"/></g><g stroke="#ffc660" stroke-opacity=".6" stroke-width="5" stroke-linecap="round"><path d="M1426 442H1438M1420 462H1436M1426 482H1438"/></g><text x="1526" y="474" font-size="36" font-weight="bold" fill="#fff0d8">Keep moving</text><rect x="1526" y="512" width="300" height="26" rx="6" fill="#15101C" stroke="#ffffff" stroke-opacity=".2" stroke-width="2"/><rect x="1530" y="516" width="114" height="18" rx="4" fill="#ff6a5c"/><rect x="1644" y="516" width="90" height="18" fill="#ff6a5c" fill-opacity=".28"/><path d="M1856 504V542" stroke="#ff6a5c" stroke-width="6" stroke-linecap="round"/><path d="M1844 532L1856 548L1868 532" fill="none" stroke="#ff6a5c" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><text x="1526" y="588" font-size="28" fill="#d6cbd5">Standing still drains health</text></g></svg>
